<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>회원가입</title>
<style>
  /* 디자인만 참고: 베이스 리셋 & 톤 */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    background: #f8f9fa;
    color: #1a1a1a;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }

  /* 카드형 폼 */
  .card {
    width: 100%;
    max-width: 520px;
    background: #ffffff;
    border: 1px solid #edf2f7;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.06);
  }

  .title {
    font-size: 28px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 14px;
    color: #718096;
    text-align: center;
    margin-bottom: 24px;
  }

  .row { margin-bottom: 14px; }
  .label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    color: #2d3748;
    font-weight: 600;
  }

  /* 입력·셀렉트·버튼 크기/여백 일치 */
  .input, .select, .button {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 15px;
  }

  .input, .select {
    border: 1px solid #e2e8f0;
    background: #fff;
    color: #2d3748;
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  .input:focus, .select:focus {
    border-color: #667eea;
    box-shadow: 0 0 0 3px rgba(102,126,234,0.2);
  }

  /* 그라디언트 CTA 버튼 */
  .button {
    border: none;
    cursor: pointer;
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(102,126,234,0.4);
  }

  .help { font-size: 12px; color: #a0aec0; margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <h1 class="title">회원가입</h1>
    <p class="subtitle">학생/관리자 계정을 생성합니다.</p>

    <form id="signupForm" novalidate>
      <div class="row">
        <label for="role" class="label">회원 유형</label>
        <select id="role" class="select" required>
          <option value="">--선택--</option>
          <option value="student">학생 (Student)</option>
          <option value="admin">관리자 (Admin)</option>
        </select>
      </div>

      <div class="row">
        <label for="id" class="label">아이디</label>
        <input type="text" id="id" class="input" placeholder="아이디 입력" required />
      </div>

      <div class="row">
        <label for="pw" class="label">비밀번호</label>
        <input type="password" id="pw" class="input" placeholder="비밀번호 입력" required />
      </div>

      <div class="row">
        <label for="pw2" class="label">비밀번호 확인</label>
        <input type="password" id="pw2" class="input" placeholder="비밀번호 재입력" required />
        <div class="help">비밀번호가 일치해야 가입이 가능합니다.</div>
      </div>

      <div class="row">
        <button type="submit" class="button">회원가입</button>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("signupForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const role = document.getElementById("role").value.trim();
      const id = document.getElementById("id").value.trim();
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;

      if (!role) {
        alert("회원 유형을 선택하세요.");
        return;
      }
      if (!id || !pw || !pw2) {
        alert("모든 항목을 입력해주세요.");
        return;
      }
      if (pw !== pw2) {
        alert("비밀번호가 일치하지 않습니다.");
        return;
      }

      alert(role === "student" ? "학생 회원가입 완료!" : "관리자 회원가입 완료!");
      // TODO: API 연동 예시
      // fetch('/api/auth/signup', {
      //   method: 'POST',
      //   headers: { 'Content-Type': 'application/json' },
      //   body: JSON.stringify({ role, id, pw })
      // });
    });
  </script>
</body>
</html>
